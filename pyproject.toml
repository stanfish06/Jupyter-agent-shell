[project]
name = "mash"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Stan", email = "zyyu@umich.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "agent-client-protocol>=0.12.1",
    "jupyter-client>=8.10.0",
    "jupyter-matlab-proxy>=0.20.0",
    "matlabengine",
    "mcp>=2.3.0",
    "nbformat>=5.11.1",
    "psutil>=7.2.2",
    "textual>=8.2.8",
    "textual-image>=0.14.1",
]

[project.scripts]
mash = "mash:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
matlabengine = { path = "/Applications/MATLAB_R2026a.app/extern/engines/python" }

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012", "B008"]

[tool.ty.environment]
python-version = "3.12"
